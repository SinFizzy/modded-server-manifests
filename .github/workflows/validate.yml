name: Check manifests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker
        run: pip install "jsonschema[format]==4.23.0"

      - name: Check every manifest
        run: python .github/scripts/validate_manifests.py
